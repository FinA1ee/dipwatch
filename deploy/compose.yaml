# Local and server stack. Values come from deploy/.env (see .env.example).
name: dipwatch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dipwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: dipwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only, for tests and psql from the host.
      - "127.0.0.1:${PG_HOST_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dipwatch -d dipwatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  core-api:
    image: ${IMAGE_PREFIX:-dipwatch}-core:${IMAGE_TAG:-local}
    build: ../core
    command: ["core-api", "serve"]
    environment:
      DATABASE_URL: postgres://dipwatch:${POSTGRES_PASSWORD}@postgres:5432/dipwatch?sslmode=disable
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:?set CORE_INTERNAL_TOKEN in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  worker:
    image: ${IMAGE_PREFIX:-dipwatch}-core:${IMAGE_TAG:-local}
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://dipwatch:${POSTGRES_PASSWORD}@postgres:5432/dipwatch?sslmode=disable
    depends_on:
      core-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536m

  gateway:
    image: ${IMAGE_PREFIX:-dipwatch}-gateway:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      CORE_URL: http://core-api:8000
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN}
      PORT: "3000"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  web:
    image: ${IMAGE_PREFIX:-dipwatch}-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "${HTTP_PORT:-18080}:80"
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:

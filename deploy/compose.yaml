# Local and server stack. Values come from deploy/.env (see .env.example).
name: dipwatch

# LLM settings for the intent check (core-api) and the browsing agent and matcher
# (worker). An empty LLM_API_KEY turns all three off.
x-llm-env: &llm-env
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
  LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_PRICE_IN_CNY_PER_M: ${LLM_PRICE_IN_CNY_PER_M:-2}
  LLM_PRICE_OUT_CNY_PER_M: ${LLM_PRICE_OUT_CNY_PER_M:-8}
  LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}

services:
  postgres:
    # On the server this points at a copy in ACR, because Docker Hub is not reachable.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: dipwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: dipwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only, for tests and psql from the host.
      - "127.0.0.1:${PG_HOST_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dipwatch -d dipwatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  core-api:
    image: ${IMAGE_REPO:-dipwatch}:core-${IMAGE_TAG:-local}
    build:
      context: ../core
      target: core
    command: ["core-api", "serve"]
    environment:
      DATABASE_URL: postgres://dipwatch:${POSTGRES_PASSWORD}@postgres:5432/dipwatch?sslmode=disable
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:?set CORE_INTERNAL_TOKEN in deploy/.env}
      <<: *llm-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  worker:
    # Worker image: Go worker plus Node, Chromium and Playwright MCP for the browsing agent.
    image: ${IMAGE_REPO:-dipwatch}:worker-${IMAGE_TAG:-local}
    build:
      context: ../core
      target: worker
    command: ["worker"]
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 512m
    environment:
      DATABASE_URL: postgres://dipwatch:${POSTGRES_PASSWORD}@postgres:5432/dipwatch?sslmode=disable
      <<: *llm-env
    depends_on:
      core-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536m

  gateway:
    image: ${IMAGE_REPO:-dipwatch}:gateway-${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      CORE_URL: http://core-api:8000
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN}
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-production}
      # Sign-in (Better Auth). Empty BETTER_AUTH_SECRET turns sign-in off.
      DATABASE_URL: postgres://dipwatch:${POSTGRES_PASSWORD}@postgres:5432/dipwatch?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:18080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  web:
    image: ${IMAGE_REPO:-dipwatch}:web-${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "${HTTP_PORT:-18080}:80"
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:

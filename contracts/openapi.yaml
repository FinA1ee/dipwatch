components:
  schemas:
    DoneEvent:
      additionalProperties: false
      properties:
        timed_out:
          description: true when some sources did not finish in time
          type: boolean
      required:
        - timed_out
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        db:
          description: Postgres status
          enum:
            - ok
            - down
          type: string
        status:
          description: ok when every dependency answers
          enum:
            - ok
            - degraded
          type: string
      required:
        - status
        - db
      type: object
    Money:
      additionalProperties: false
      properties:
        currency:
          maxLength: 3
          minLength: 3
          type: string
        minor:
          format: int64
          type: integer
      required:
        - minor
        - currency
      type: object
    Offer:
      additionalProperties: false
      properties:
        availability:
          enum:
            - in_stock
            - out_of_stock
            - unknown
          type: string
        condition:
          enum:
            - new
            - used
            - refurbished
            - unknown
          type: string
        converted:
          $ref: "#/components/schemas/Money"
          description: Price in the requested currency; null when no exchange rate is stored
        id:
          format: int64
          type: integer
        price:
          $ref: "#/components/schemas/Money"
          description: Price in the store's currency
        seller_type:
          enum:
            - official
            - marketplace
            - individual
            - unknown
          type: string
        shipping_minor:
          description: Shipping in the store's currency, when known
          format: int64
          type: integer
        source:
          $ref: "#/components/schemas/Source"
        title:
          description: English title
          type: string
        title_original:
          description: Title as the store shows it
          type: string
        url:
          format: uri
          type: string
      required:
        - id
        - title
        - title_original
        - source
        - url
        - price
        - converted
        - condition
        - availability
        - seller_type
      type: object
    OffersEvent:
      additionalProperties: false
      properties:
        offers:
          description: Cheapest first, compared in CNY
          items:
            $ref: "#/components/schemas/Offer"
          type:
            - array
            - "null"
        pending:
          description: Ids of sources still searching
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - offers
        - pending
      type: object
    Product:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - name
      type: object
    Result:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Result.json
          format: uri
          readOnly: true
          type: string
        offers:
          description: Cheapest first, compared in CNY
          items:
            $ref: "#/components/schemas/Offer"
          type:
            - array
            - "null"
        product:
          $ref: "#/components/schemas/Product"
        status:
          description: "refreshing: open the events stream for new offers"
          enum:
            - fresh
            - refreshing
          type: string
      required:
        - product
        - status
        - offers
      type: object
    SearchInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SearchInputBody.json
          format: uri
          readOnly: true
          type: string
        currency:
          default: CNY
          description: Currency for converted prices
          pattern: ^[A-Z]{3}$
          type: string
        query:
          description: Product to search for, e.g. RTX 5090. At most 80 characters after trimming.
          maxLength: 200
          type: string
      required:
        - query
      type: object
    Source:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
      required:
        - id
        - name
        - region
      type: object
info:
  title: Dipwatch Core API
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "503":
          description: A dependency is down
      summary: Service health
      tags:
        - System
  /search:
    post:
      description: Resolves the query to one product and returns its offers. When they are older than 6 hours a refresh starts; follow it with the events stream.
      operationId: search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Search offers for a product
      tags:
        - Search
  /search/{productId}/events:
    get:
      description: Sends the full ranked offer list now and after each source finishes, then `done`.
      operationId: search-events
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: currency
          schema:
            default: CNY
            pattern: ^[A-Z]{3}$
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/DoneEvent"
                        event:
                          const: done
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event done
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/OffersEvent"
                        event:
                          const: offers
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event offers
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stream offers while sources finish
      tags:
        - Search

          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Search offers for a product
      tags:
        - Search
  /search/{productId}/events:
    get:
      description: Sends the full ranked offer list now and after each source finishes, then `done`.
      operationId: search-events
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: currency
          schema:
            default: CNY
            pattern: ^[A-Z]{3}$
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/DoneEvent"
                        event:
                          const: done
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event done
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/OffersEvent"
                        event:
                          const: offers
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event offers
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stream offers while sources finish
      tags:
        - Search

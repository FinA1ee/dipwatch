  /admin/live:
    get:
      description: Sends `snapshot` with recent runs, then an `event` per start, step and end.
      operationId: admin-live
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/Event"
                        event:
                          const: event
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event event
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Snapshot"
                        event:
                          const: snapshot
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event snapshot
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:

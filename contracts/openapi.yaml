components:
  schemas:
    DayLow:
      additionalProperties: false
      properties:
        converted:
          $ref: "#/components/schemas/Money"
          description: Lowest price that day, in the requested currency
        day:
          format: date
          type: string
      required:
        - day
        - converted
      type: object
    Detail:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Detail.json
          format: uri
          readOnly: true
          type: string
        cost_cny:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        duration_ms:
          format: int64
          type: integer
        error:
          type: string
        id:
          format: int64
          type: integer
        kind:
          enum:
            - browse
            - match
            - intent
          type: string
        model:
          type: string
        offers:
          format: int64
          type: integer
        outcome:
          type: string
        product_id:
          format: int64
          type: integer
        prompt_version:
          type: string
        source_id:
          type: string
        steps:
          format: int64
          type: integer
        tokens_in:
          format: int64
          type: integer
        tokens_out:
          format: int64
          type: integer
        trace:
          items:
            $ref: "#/components/schemas/Step"
          type: array
      required:
        - trace
        - id
        - kind
        - model
        - prompt_version
        - outcome
        - offers
        - steps
        - tokens_in
        - tokens_out
        - cost_cny
        - duration_ms
        - created_at
      type: object
    DoneEvent:
      additionalProperties: false
      properties:
        timed_out:
          description: true when some sources did not finish in time
          type: boolean
      required:
        - timed_out
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        cost_cny:
          format: double
          type: number
        index:
          description: Step number, from 1
          format: int64
          type: integer
        kind:
          enum:
            - start
            - step
            - end
          type: string
        offers:
          format: int64
          type: integer
        outcome:
          type: string
        product:
          type: string
        run:
          description: Run key, unique per run
          type: string
        source_id:
          type: string
        step:
          $ref: "#/components/schemas/Step"
        store:
          type: string
        tokens_in:
          format: int64
          type: integer
        tokens_out:
          format: int64
          type: integer
      required:
        - run
        - kind
        - at
        - source_id
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        db:
          description: Postgres status
          enum:
            - ok
            - down
          type: string
        status:
          description: ok when every dependency answers
          enum:
            - ok
            - degraded
          type: string
      required:
        - status
        - db
      type: object
    Item:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Item.json
          format: uri
          readOnly: true
          type: string
        baseline:
          $ref: "#/components/schemas/Money"
          description: Lowest price when tracking started, in CNY
        note:
          type: string
        product_id:
          format: int64
          type: integer
        product_name:
          type: string
        rules:
          items:
            $ref: "#/components/schemas/Rule"
          type: array
        tracked_at:
          format: date-time
          type: string
      required:
        - product_id
        - product_name
        - note
        - rules
        - tracked_at
      type: object
    Metrics:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Metrics.json
          format: uri
          readOnly: true
          type: string
        sources:
          items:
            $ref: "#/components/schemas/SourceDay"
          type: array
        spend:
          items:
            $ref: "#/components/schemas/SpendDay"
          type: array
      required:
        - sources
        - spend
      type: object
    Money:
      additionalProperties: false
      properties:
        currency:
          pattern: ^[A-Z]{3}$
          type: string
        minor:
          format: int64
          type: integer
      required:
        - minor
        - currency
      type: object
    Offer:
      additionalProperties: false
      properties:
        availability:
          enum:
            - in_stock
            - out_of_stock
            - unknown
          type: string
        condition:
          enum:
            - new
            - used
            - refurbished
            - unknown
          type: string
        converted:
          $ref: "#/components/schemas/Money"
          description: Price in the requested currency; null when no exchange rate is stored
        id:
          format: int64
          type: integer
        price:
          $ref: "#/components/schemas/Money"
          description: Price in the store's currency
        seller_type:
          enum:
            - official
            - third_party
            - individual
            - unknown
          type: string
        shipping_minor:
          description: Shipping in the store's currency, when known
          format: int64
          type: integer
        source:
          $ref: "#/components/schemas/Source"
        title:
          description: English title
          type: string
        title_original:
          description: Title as the store shows it
          type: string
        url:
          format: uri
          type: string
      required:
        - id
        - title
        - title_original
        - source
        - url
        - price
        - converted
        - condition
        - availability
        - seller_type
      type: object
    OffersEvent:
      additionalProperties: false
      properties:
        offers:
          description: Cheapest first, compared in CNY
          items:
            $ref: "#/components/schemas/Offer"
          type: array
        pending:
          description: Ids of sources still searching
          items:
            type: string
          type: array
      required:
        - offers
        - pending
      type: object
    Product:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - name
      type: object
    ProductPage:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ProductPage.json
          format: uri
          readOnly: true
          type: string
        history:
          description: Oldest first; days without any price are left out
          items:
            $ref: "#/components/schemas/DayLow"
          type: array
        last_refreshed:
          format: date-time
          type: string
        offers:
          description: Cheapest first, compared in CNY
          items:
            $ref: "#/components/schemas/Offer"
          type: array
        product:
          $ref: "#/components/schemas/Product"
        refreshing:
          description: true while sources are being searched
          type: boolean
      required:
        - product
        - refreshing
        - offers
        - history
      type: object
    Result:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Result.json
          format: uri
          readOnly: true
          type: string
        offers:
          description: Cheapest first, compared in CNY
          items:
            $ref: "#/components/schemas/Offer"
          type: array
        product:
          $ref: "#/components/schemas/Product"
        status:
          description: "refreshing: open the events stream for new offers"
          enum:
            - fresh
            - refreshing
          type: string
      required:
        - product
        - status
        - offers
      type: object
    Rule:
      additionalProperties: false
      properties:
        below:
          $ref: "#/components/schemas/Money"
          description: "For below: alert when an offer costs less than this"
        percent:
          description: "For drop: alert at this drop from the price when tracking started"
          format: int64
          maximum: 90
          minimum: 0
          type: integer
        type:
          enum:
            - below
            - drop
            - back_in_stock
            - new_source
          type: string
      required:
        - type
      type: object
    Run:
      additionalProperties: false
      properties:
        end:
          $ref: "#/components/schemas/Event"
          description: Missing while the run is in progress
        start:
          $ref: "#/components/schemas/Event"
        steps:
          items:
            $ref: "#/components/schemas/Event"
          type: array
      required:
        - start
        - steps
      type: object
    RunsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RunsOutputBody.json
          format: uri
          readOnly: true
          type: string
        runs:
          description: Newest first
          items:
            $ref: "#/components/schemas/Summary"
          type: array
      required:
        - runs
      type: object
    SaveSettingsInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SaveSettingsInputBody.json
          format: uri
          readOnly: true
          type: string
        email_alerts:
          type: boolean
        feishu_webhook:
          description: Feishu or Lark bot webhook URL; empty turns Feishu alerts off
          maxLength: 500
          type: string
      required:
        - feishu_webhook
        - email_alerts
      type: object
    SaveTrackedInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SaveTrackedInputBody.json
          format: uri
          readOnly: true
          type: string
        note:
          description: Up to 500 characters
          maxLength: 2000
          type: string
        rules:
          items:
            $ref: "#/components/schemas/Rule"
          maxItems: 8
          minItems: 1
          type: array
      required:
        - note
        - rules
      type: object
    SearchInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SearchInputBody.json
          format: uri
          readOnly: true
          type: string
        currency:
          default: CNY
          description: Currency for converted prices
          pattern: ^[A-Z]{3}$
          type: string
        query:
          description: Product to search for, e.g. RTX 5090. At most 80 characters after trimming.
          maxLength: 200
          type: string
      required:
        - query
      type: object
    Settings:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Settings.json
          format: uri
          readOnly: true
          type: string
        email:
          type: string
        email_alerts:
          type: boolean
        email_available:
          description: "false while the site has no SMTP: email alerts are not sent yet"
          type: boolean
        feishu_webhook:
          description: "Empty: no Feishu alerts"
          type: string
      required:
        - feishu_webhook
        - email_alerts
        - email_available
        - email
      type: object
    SimulateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SimulateInputBody.json
          format: uri
          readOnly: true
          type: string
        percent:
          default: 20
          format: int64
          maximum: 90
          minimum: 1
          type: integer
      required:
        - percent
      type: object
    Snapshot:
      additionalProperties: false
      properties:
        runs:
          description: Newest first
          items:
            $ref: "#/components/schemas/Run"
          type: array
      required:
        - runs
      type: object
    Source:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
      required:
        - id
        - name
        - region
      type: object
    SourceDay:
      additionalProperties: false
      properties:
        cost_per_run_cny:
          format: double
          type: number
        day:
          format: date
          type: string
        median_steps:
          format: double
          type: number
        offers_per_run:
          format: double
          type: number
        runs:
          format: int64
          type: integer
        source_id:
          type: string
        success_rate:
          description: "Share of runs that answered: offers, or a confirmed 'no listings'"
          format: double
          type: number
        tokens_per_run:
          format: double
          type: number
        top_failure:
          description: Most common failed outcome; empty when none failed
          type: string
      required:
        - source_id
        - day
        - runs
        - success_rate
        - offers_per_run
        - median_steps
        - tokens_per_run
        - cost_per_run_cny
        - top_failure
      type: object
    SpendDay:
      additionalProperties: false
      properties:
        calls:
          format: int64
          type: integer
        cost_cny:
          format: double
          type: number
        day:
          format: date
          type: string
        kind:
          enum:
            - browse
            - match
            - intent
          type: string
      required:
        - kind
        - day
        - calls
        - cost_cny
      type: object
    Step:
      additionalProperties: false
      properties:
        arguments:
          type: string
        ms:
          description: Time the tool took
          format: int64
          type: integer
        note:
          description: Harness event, e.g. the budget wrap-up
          type: string
        result:
          description: Excerpt of what the tool returned
          type: string
        thought:
          description: Text the model wrote with this turn's tool calls
          type: string
        tokens_in:
          description: Tokens of the model call that chose this step (first step of a turn only)
          format: int64
          type: integer
        tokens_out:
          format: int64
          type: integer
        tool:
          type: string
      type: object
    Summary:
      additionalProperties: false
      properties:
        cost_cny:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        duration_ms:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        kind:
          enum:
            - browse
            - match
            - intent
          type: string
        model:
          type: string
        offers:
          format: int64
          type: integer
        outcome:
          type: string
        product_id:
          format: int64
          type: integer
        prompt_version:
          type: string
        source_id:
          type: string
        steps:
          format: int64
          type: integer
        tokens_in:
          format: int64
          type: integer
        tokens_out:
          format: int64
          type: integer
      required:
        - id
        - kind
        - model
        - prompt_version
        - outcome
        - offers
        - steps
        - tokens_in
        - tokens_out
        - cost_cny
        - duration_ms
        - created_at
      type: object
    TrackedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TrackedOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Newest first
          items:
            $ref: "#/components/schemas/Item"
          type: array
      required:
        - items
      type: object
info:
  title: Dipwatch Core API
  version: 0.1.0
openapi: 3.1.0
paths:
  /admin/live:
    get:
      description: Sends `snapshot` with recent runs, then an `event` per start, step and end.
      operationId: admin-live
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/Event"
                        event:
                          const: event
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event event
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Snapshot"
                        event:
                          const: snapshot
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event snapshot
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Stream browsing-agent steps as they happen
      tags:
        - Admin
  /admin/metrics:
    get:
      operationId: admin-metrics
      parameters:
        - explode: false
          in: query
          name: days
          schema:
            default: 7
            format: int64
            maximum: 30
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metrics"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Per-source agent metrics and LLM spend per day
      tags:
        - Admin
  /admin/products/{productId}/simulate-drop:
    post:
      description: "Test of alert delivery (M6.3): changes stored prices, so use it on test products only."
      operationId: admin-simulate-drop
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateInputBody"
        required: true
      responses:
        "202":
          description: Accepted
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Lower the cheapest offer and run the alert check
      tags:
        - Admin
  /admin/runs:
    get:
      operationId: admin-runs
      parameters:
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - browse
              - match
              - intent
              - ""
            type: string
        - explode: false
          in: query
          name: source
          schema:
            type: string
        - explode: false
          in: query
          name: outcome
          schema:
            type: string
        - explode: false
          in: query
          name: prompt_version
          schema:
            type: string
        - description: UTC day, YYYY-MM-DD
          explode: false
          in: query
          name: day
          schema:
            description: UTC day, YYYY-MM-DD
            format: date
            type: string
        - description: "Paging: runs older than this id"
          explode: false
          in: query
          name: before
          schema:
            description: "Paging: runs older than this id"
            format: int64
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunsOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List agent runs
      tags:
        - Admin
  /admin/runs/{runId}:
    get:
      operationId: admin-run
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: One agent run with its trace
      tags:
        - Admin
  /healthz:
    get:
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "503":
          description: A dependency is down
      summary: Service health
      tags:
        - System
  /me/settings:
    get:
      operationId: get-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"

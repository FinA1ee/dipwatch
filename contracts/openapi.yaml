components:
  schemas:
    DayLow:
      additionalProperties: false
      properties:
        converted:
          $ref: "#/components/schemas/Money"
          description: Lowest price that day, in the requested currency
        day:
          format: date
          type: string
      required:
        - day
        - converted
      type: object
    DayPrice:
      additionalProperties: false
      properties:
        day:
          format: date
          type: string
        price:
          $ref: "#/components/schemas/Money"
          description: In CNY
      required:
        - day
        - price
      type: object
    Detail:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Detail.json
          format: uri
          readOnly: true
          type: string
        cost_cny:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        duration_ms:
          format: int64
          type: integer
        error:
          type: string
        id:
          format: int64
          type: integer
        kind:
          enum:
            - browse
            - match
            - intent
          type: string
        model:
          type: string
        offers:
          format: int64
          type: integer
        outcome:
          type: string
        product_id:
          format: int64
          type: integer
        prompt_version:
          type: string
        source_id:
          type: string
        steps:
          format: int64
          type: integer
        tokens_in:
          format: int64
          type: integer
        tokens_out:
          format: int64
          type: integer
        trace:
          items:
            $ref: "#/components/schemas/Step"
          type: array
      required:
        - trace
        - id
        - kind
        - model
        - prompt_version
        - outcome
        - offers
        - steps
        - tokens_in
        - tokens_out
        - cost_cny
        - duration_ms
        - created_at
      type: object
    DoneEvent:
      additionalProperties: false
      properties:
        timed_out:
          description: true when some sources did not finish in time
          type: boolean
      required:
        - timed_out
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        cost_cny:
          format: double
          type: number
        index:
          description: Step number, from 1
          format: int64
          type: integer
        kind:
          enum:
            - start
            - step
            - end
          type: string
        offers:
          format: int64
          type: integer
        outcome:
          type: string
        product:
          type: string
        run:
          description: Run key, unique per run
          type: string
        source_id:
          type: string
        step:
          $ref: "#/components/schemas/Step"
        store:
          type: string
        tokens_in:
          format: int64
          type: integer
        tokens_out:
          format: int64
          type: integer
      required:
        - run
        - kind
        - at
        - source_id
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        db:
          description: Postgres status
          enum:
            - ok
            - down
          type: string
        status:
          description: ok when every dependency answers
          enum:
            - ok
            - degraded
          type: string
      required:
        - status
        - db
      type: object
    Item:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Item.json
          format: uri
          readOnly: true
          type: string
        baseline:
          $ref: "#/components/schemas/Money"
          description: Price when tracking started (of the listing, if one is pinned), in CNY
        check_every_hours:
          description: "Chosen re-check interval in hours; 0: automatic (6 hours, 2 to 24 as prices move)"
          format: int64
          type: integer
        history:
          description: "The tracked price per day since tracking started (at most a year), oldest first: the listing's, or the lowest of the variant at the tracker's stores"
          items:
            $ref: "#/components/schemas/DayPrice"
          type: array
        last_checked:
          description: When the product was last refreshed
          format: date-time
          type: string
        listing:
          $ref: "#/components/schemas/Listing"
          description: "The listing this tracker follows; absent: the product's cheapest offer"
        next_check:
          description: When the next scheduled refresh is due, at the latest
          format: date-time
          type: string
        note:
          type: string
        product_id:
          format: int64
          type: integer
        product_name:
          type: string
        rules:
          items:
            $ref: "#/components/schemas/Rule"
          type: array
        stores:
          description: "Stores refreshed and alerted on; empty: every store"
          items:
            type: string
          type: array
        tracked_at:
          format: date-time
          type: string
        variant:
          description: "Only listings of this variant count, e.g. 24GB; empty: any variant"
          type: string
      required:
        - product_id
        - product_name
        - note
        - rules
        - stores
        - variant
        - history
        - check_every_hours
        - tracked_at
      type: object
    Limits:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Limits.json
          format: uri
          readOnly: true
          type: string
        daily_budget_cny:
          description: LLM spend per China day; at 80% only tracked products get agent runs, at 100% only stored data is served (C4)
          format: double
          maximum: 1000
          minimum: 0
          type: number
        invite_only:
          description: Only invited members (and admins) may run costly searches and track products; everyone can still read stored results
          type: boolean
        invited:
          description: Email addresses of invited members, as their sign-in account reports them
          items:
            type: string
          maxItems: 500
          type: array
        member_daily_searches:
          description: Costly searches per member per day (C1)
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
        min_check_hours:
          description: Shortest re-check interval a member may choose for a tracked product
          format: int64
          maximum: 24
          minimum: 1
          type: integer
        sources_per_search:
          description: Stores a member or visitor may pick for one search
          format: int64
          maximum: 20
          minimum: 1
          type: integer
        tracked_per_member:
          description: Products one member may track (C2)
          format: int64
          maximum: 100
          minimum: 0
          type: integer
        visitor_daily_searches:
          description: Costly searches per visitor IP per day (C1)
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
      required:
        - sources_per_search
        - tracked_per_member
        - visitor_daily_searches
        - member_daily_searches
        - daily_budget_cny
        - min_check_hours
        - invite_only
        - invited
      type: object
    Listing:
      additionalProperties: false
      properties:
        gone:
          description: The store's last refresh no longer listed it
          type: boolean
        offer_id:
          format: int64
          type: integer
        price:
          $ref: "#/components/schemas/Money"
          description: Price at the store, in its currency
        store:
          description: Source id
          type: string
        title:
          type: string
        url:
          type: string
        variant:
          description: The listing's variant, e.g. 24GB; empty when its title does not say
          type: string
      required:
        - offer_id
        - title
        - store
        - url
        - price
        - variant
        - gone
      type: object
    Metrics:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Metrics.json
          format: uri
          readOnly: true
          type: string
        sources:
          items:
            $ref: "#/components/schemas/SourceDay"
          type: array
        spend:
          items:
            $ref: "#/components/schemas/SpendDay"
          type: array
      required:
        - sources
        - spend
      type: object
    Money:
      additionalProperties: false
      properties:
        currency:
          pattern: ^[A-Z]{3}$
          type: string
        minor:
          format: int64
          type: integer
      required:
        - minor
        - currency
      type: object
    Offer:
      additionalProperties: false
      properties:
        availability:
          enum:
            - in_stock
            - out_of_stock
            - unknown
          type: string
        condition:
          enum:
            - new
            - used
            - refurbished
            - unknown
          type: string
        converted:
          $ref: "#/components/schemas/Money"
          description: Price in the requested currency; null when no exchange rate is stored
        id:
          format: int64
          type: integer
        price:
          $ref: "#/components/schemas/Money"
          description: Price in the store's currency
        price_unconfirmed:
          description: The store relays this price from a shop's feed without showing it on its own page; it may be stale
          type: boolean
        seller_type:
          enum:
            - official
            - third_party
            - individual
            - unknown
          type: string
        shipping_minor:
          description: Shipping in the store's currency, when known
          format: int64
          type: integer
        source:
          $ref: "#/components/schemas/Source"
        title:
          description: English title
          type: string
        title_original:
          description: Title as the store shows it
          type: string
        unusual_price:
          description: More than twice, or under half, the median price of listings with the same variant
          type: boolean
        url:
          format: uri
          type: string
        variant:
          description: Memory or storage size the listing sells, e.g. 24GB; empty when the title does not say
          type: string
      required:
        - id
        - title
        - title_original
        - source
        - url
        - price
        - converted
        - condition
        - availability
        - seller_type
        - variant
      type: object
    OffersEvent:
      additionalProperties: false
      properties:
        offers:
          description: Cheapest first, compared in CNY
          items:
            $ref: "#/components/schemas/Offer"
          type: array
        pending:
          description: Ids of sources still searching
          items:
            type: string
          type: array
      required:
        - offers
        - pending
      type: object
    Product:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - name
      type: object
    ProductPage:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ProductPage.json
          format: uri
          readOnly: true
          type: string
        history:
          description: Oldest first; days without any price are left out
          items:
            $ref: "#/components/schemas/DayLow"
          type: array
        history_of:
          description: Offer id the history is for
          format: int64
          type: integer
        history_variant:
          description: Variant the history is the daily lowest of, when no listing is given
          type: string
        last_refreshed:
          format: date-time
          type: string
        offers:
          description: Cheapest first, compared in CNY
          items:
            $ref: "#/components/schemas/Offer"
          type: array
        product:
          $ref: "#/components/schemas/Product"
        refreshing:
          description: true while sources are being searched
          type: boolean
      required:
        - product
        - refreshing
        - offers
        - history
      type: object
    Result:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Result.json
          format: uri
          readOnly: true
          type: string
        invite_only:
          description: true when stored offers were not refreshed because the viewer is not invited
          type: boolean
        offers:
          description: Cheapest first, compared in CNY; offers with an unconfirmed or unusual price come after the others
          items:
            $ref: "#/components/schemas/Offer"
          type: array
        paused:
          description: true when stored offers are older than usual because today's budget is spent
          type: boolean
        product:
          $ref: "#/components/schemas/Product"
        status:
          description: "refreshing: open the events stream for new offers"
          enum:
            - fresh
            - refreshing
          type: string
        variant:
          description: Size named in the query (e.g. 48GB), for the page to preselect
          type: string
      required:
        - product
        - status
        - offers
      type: object
    Rule:
      additionalProperties: false
      properties:
        below:
          $ref: "#/components/schemas/Money"
          description: "For below: alert when an offer costs less than this"
        percent:
          description: "For drop: alert at this drop from the price when tracking started. For change: alert when the price moves at least this much, up or down, from the last price seen"
          format: int64
          maximum: 90
          minimum: 0
          type: integer
        type:
          enum:
            - below
            - drop
            - back_in_stock
            - new_source
            - change
          type: string
      required:
        - type
      type: object
    Run:
      additionalProperties: false
      properties:
        end:
          $ref: "#/components/schemas/Event"
          description: Missing while the run is in progress
        start:
          $ref: "#/components/schemas/Event"
        steps:
          items:
            $ref: "#/components/schemas/Event"
          type: array
      required:
        - start
        - steps
      type: object
    RunsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RunsOutputBody.json
          format: uri
          readOnly: true
          type: string
        runs:
          description: Newest first
          items:
            $ref: "#/components/schemas/Summary"
          type: array
      required:
        - runs
      type: object
    SaveSettingsInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SaveSettingsInputBody.json
          format: uri
          readOnly: true
          type: string
        email_alerts:
          type: boolean
        feishu_webhook:
          description: Feishu or Lark bot webhook URL; empty turns Feishu alerts off
          maxLength: 500
          type: string
      required:
        - feishu_webhook
        - email_alerts
      type: object
    SaveTrackedInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SaveTrackedInputBody.json
          format: uri
          readOnly: true
          type: string
        check_every_hours:
          description: Re-check interval in hours; omit or 0 for automatic
          format: int64
          maximum: 168
          minimum: 0
          type: integer
        note:
          description: Up to 500 characters
          maxLength: 2000
          type: string
        offer_id:
          description: Follow this listing only; omit to follow the product's cheapest offer
          format: int64
          type: integer
        rules:
          items:
            $ref: "#/components/schemas/Rule"
          maxItems: 8
          minItems: 1
          type: array
        stores:
          description: Stores to track at (needed when tracking starts without a listing; ignored afterwards)
          items:
            type: string
          maxItems: 20
          type: array
        variant:
          description: "Without a listing: only listings of this variant count, e.g. 24GB; omit for any variant"
          maxLength: 16
          type: string
      required:
        - note
        - rules
      type: object
    SearchInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SearchInputBody.json
          format: uri
          readOnly: true
          type: string
        currency:
          default: CNY
          description: Currency for converted prices
          pattern: ^[A-Z]{3}$
          type: string
        query:
          description: Product to search for, e.g. RTX 5090. At most 80 characters after trimming.
          maxLength: 200
          type: string
        stores:
          description: Store ids to search, from GET /stores; at most the per-search limit
          items:
            type: string
          maxItems: 20
          minItems: 1
          type: array
      required:
        - query
        - stores
      type: object
    Settings:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Settings.json
          format: uri
          readOnly: true
          type: string
        email:
          type: string
        email_alerts:
          type: boolean
        email_available:
          description: "false while the site has no SMTP: email alerts are not sent yet"
          type: boolean
        feishu_webhook:
          description: "Empty: no Feishu alerts"
          type: string
      required:
        - feishu_webhook
        - email_alerts
        - email_available
        - email
      type: object
    SimulateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SimulateInputBody.json
          format: uri
          readOnly: true
          type: string
        percent:
          default: 20
          format: int64
          maximum: 90
          minimum: 1
          type: integer
      required:
        - percent
      type: object
    Snapshot:
      additionalProperties: false
      properties:
        runs:
          description: Newest first
          items:
            $ref: "#/components/schemas/Run"
          type: array
      required:
        - runs
      type: object
    Source:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
      required:
        - id
        - name
        - region
      type: object
    SourceDay:
      additionalProperties: false
      properties:
        cost_per_run_cny:
          format: double
          type: number
        day:
          format: date
          type: string
        median_steps:
          format: double
          type: number
        offers_per_run:
          format: double
          type: number
        runs:
          format: int64
          type: integer
        source_id:
          type: string
        success_rate:
          description: "Share of runs that answered: offers, or a confirmed 'no listings'"
          format: double
          type: number
        tokens_per_run:
          format: double
          type: number
        top_failure:
          description: Most common failed outcome; empty when none failed
          type: string
      required:
        - source_id
        - day
        - runs
        - success_rate
        - offers_per_run
        - median_steps
        - tokens_per_run
        - cost_per_run_cny
        - top_failure
      type: object
    SpendDay:
      additionalProperties: false
      properties:
        calls:
          format: int64
          type: integer
        cost_cny:
          format: double
          type: number
        day:
          format: date
          type: string
        kind:
          enum:
            - browse
            - match
            - intent
          type: string
      required:
        - kind
        - day
        - calls
        - cost_cny
      type: object
    Status:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Status.json
          format: uri
          readOnly: true
          type: string
        budget_cny:
          format: double
          type: number
        level:
          enum:
            - normal
            - tracked_only
            - stored_only
          type: string
        today_cny:
          format: double
          type: number
      required:
        - today_cny
        - budget_cny
        - level
      type: object
    Step:
      additionalProperties: false
      properties:
        arguments:
          type: string
        ms:
          description: Time the tool took
          format: int64
          type: integer
        note:
          description: Harness event, e.g. the budget wrap-up
          type: string
        result:
          description: Excerpt of what the tool returned
          type: string
        thought:
          description: Text the model wrote with this turn's tool calls
          type: string
        tokens_in:
          description: Tokens of the model call that chose this step (first step of a turn only)
          format: int64
          type: integer
        tokens_out:
          format: int64
          type: integer
        tool:
          type: string
      type: object
    Store:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
      required:
        - id
        - name
        - region
      type: object
    StoresOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StoresOutputBody.json
          format: uri
          readOnly: true
          type: string
        per_search:
          description: How many stores one search may use
          format: int64
          type: integer
        stores:
          items:
            $ref: "#/components/schemas/Store"
          type: array
      required:
        - stores
        - per_search
      type: object
    Summary:
      additionalProperties: false
      properties:
        cost_cny:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        duration_ms:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        kind:
          enum:
            - browse
            - match
            - intent
          type: string
        model:
          type: string
        offers:
          format: int64
          type: integer
        outcome:
          type: string
        product_id:
          format: int64
          type: integer
        prompt_version:
          type: string
        source_id:
          type: string
        steps:
          format: int64
          type: integer
        tokens_in:
          format: int64
          type: integer
        tokens_out:
          format: int64
          type: integer
      required:
        - id
        - kind
        - model
        - prompt_version
        - outcome
        - offers
        - steps
        - tokens_in
        - tokens_out
        - cost_cny
        - duration_ms
        - created_at
      type: object
    TrackedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TrackedOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Newest first
          items:
            $ref: "#/components/schemas/Item"
          type: array
      required:
        - items
      type: object
info:
  title: Dipwatch Core API
  version: 0.1.0
openapi: 3.1.0
paths:
  /admin/limits:
    get:
      operationId: admin-limits
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Limits"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Budget limits
      tags:
        - Admin
    put:
      description: Applies to the next request in core-api and within 10 seconds in the worker.

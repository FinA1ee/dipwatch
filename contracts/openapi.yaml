components:
  schemas:
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        db:
          description: Postgres status
          enum:
            - ok
            - down
          type: string
        status:
          description: ok when every dependency answers
          enum:
            - ok
            - degraded
          type: string
      required:
        - status
        - db
      type: object
info:
  title: Dipwatch Core API
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "503":
          description: A dependency is down
      summary: Service health
      tags:
        - System

  /search:
    post:
      description: Resolves the query to one product and returns its offers. When they are older than 6 hours a refresh starts; follow it with the events stream.
      operationId: search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInputBody"
        required: true
      responses:
        "200":
